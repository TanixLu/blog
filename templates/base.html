<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page_meta.description }}">
    <link rel="canonical" href="{{ page_meta.canonical_url }}">
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Tanix's Blog" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>{{ page_meta.title }}</title>
    <meta property="og:type" content="{{ page_meta.og_type }}">
    <meta property="og:title" content="{{ page_meta.title }}">
    <meta property="og:description" content="{{ page_meta.description }}">
    <meta property="og:url" content="{{ page_meta.canonical_url }}">
    <meta property="og:site_name" content="Tanix's Blog">
</head>

<body>
    {% block header %}{% endblock header %}
    {% block main %}{% endblock main %}
    {% block footer %}{% endblock footer %}
</body>

</html>
